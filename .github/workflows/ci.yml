name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used or needed. The token is read-only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The destructive server tests only run against the throwaway PostgreSQL started below: it listens on loopback inside this
      # runner, is created fresh for this run with random passwords, and carries the cluster marker the test guard demands
      # (server/test/safety.ts). No external database URL is configured anywhere in this workflow, and the guard refuses
      # non-loopback hosts, so CI cannot reach (or drop anything in) a developer, staging or production database.
      PETRA_TEST_CLUSTER: disposable
      PGPORT_TEST: '54329'
    steps:
      # Actions are pinned to full commit SHAs (verified against the upstream tags below; both run on Node 24).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL 16 client tools (pg_dump / pg_restore / psql)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Start a disposable PostgreSQL 16 with TLS (loopback only)
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/pg-certs"
          scripts/ci/gen-test-certs.sh "$certs"
          sudo chown 999:999 "$certs/server.key" "$certs/server.crt"
          sudo chmod 600 "$certs/server.key"

          suffix=$(openssl rand -hex 6)
          pgpass=$(openssl rand -hex 24)
          sharedpw=$(openssl rand -hex 24)
          controlpw=$(openssl rand -hex 24)
          clusterid="ci-$GITHUB_RUN_ID-$suffix"
          echo "::add-mask::$pgpass"
          echo "::add-mask::$sharedpw"
          echo "::add-mask::$controlpw"
          masterkey=$(openssl rand -base64 32)
          echo "::add-mask::$masterkey" # before it is written to GITHUB_ENV, i.e. before any step can print its environment

          docker run -d --name petra-ci-pg \
            -e POSTGRES_PASSWORD="$pgpass" \
            -p 127.0.0.1:${PGPORT_TEST}:5432 \
            -v "$certs:/certs:ro" \
            postgres:16 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
          for i in $(seq 1 60); do
            PGPASSWORD="$pgpass" psql -h 127.0.0.1 -p "$PGPORT_TEST" -U postgres -d postgres -Atc 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          export PGPASSWORD="$pgpass"
          psql -h 127.0.0.1 -p "$PGPORT_TEST" -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE petra_disposable_test_cluster'
          psql -h 127.0.0.1 -p "$PGPORT_TEST" -U postgres -d petra_disposable_test_cluster -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE marker (cluster_id text NOT NULL)' \
            -c "INSERT INTO marker VALUES ('$clusterid')"

          base="postgres://%s@127.0.0.1:${PGPORT_TEST}/%s"
          {
            echo "PETRA_TEST_CLUSTER_ID=$clusterid"
            echo "TEST_PROVISIONER_DATABASE_URL=$(printf "$base" "postgres:$pgpass" postgres)"
            echo "TEST_DATABASE_URL=$(printf "$base" "shikkha_app:$sharedpw" shikkhaos_test)"
            echo "TEST_MIGRATION_DATABASE_URL=$(printf "$base" "postgres:$pgpass" shikkhaos_test)"
            echo "TEST_CONTROL_DATABASE_URL=$(printf "$base" "petra_control_app:$controlpw" petra_control_test)"
            echo "TEST_CONTROL_MIGRATION_DATABASE_URL=$(printf "$base" "postgres:$pgpass" petra_control_test)"
            echo "PETRA_TEST_TLS_CA=$certs/ca.crt"
            echo "PETRA_TEST_TLS_UNTRUSTED_CA=$certs/untrusted-ca.crt"
            echo "PETRA_MASTER_KEY=$masterkey"
          } >> "$GITHUB_ENV"

      - name: Server tests (real PostgreSQL, includes the TLS trusted-CA tests)
        run: npm run test -w server

      - name: Web tests
        run: npm run test -w web

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Browser smoke test: school-slug login, grace-period banner, logout, old cookie rejected. e2e/prepare.ts and
      # e2e/playwright.config.ts both run the same disposable-cluster guard as the server tests (marker, loopback, test names).
      - name: Browser smoke E2E
        run: npm run test -w e2e

      # Negative control: with the logout request dropped the very same test MUST fail, on the logout assertions.
      - name: Browser smoke E2E negative control (broken logout must be detected)
        run: |
          if npm run test:negative -w e2e > "$RUNNER_TEMP/e2e-negative.log" 2>&1; then
            echo "::error::negative control passed although logout was broken; the E2E would not catch a logout regression"
            exit 1
          fi
          grep -q "old session cookie must be rejected after logout" "$RUNNER_TEMP/e2e-negative.log"
          grep -q "browser session cookie must be cleared by logout" "$RUNNER_TEMP/e2e-negative.log"
          echo "negative control failed for the intended reasons"

      # Desktop shell (Electron around the unchanged web UI): same disposable cluster, real API, headless X server.
      - name: Install Xvfb for the desktop smoke tests
        run: sudo apt-get install -y -qq xvfb

      - name: Desktop shell smoke (branded profile build, development launch)
        run: npm run test:desktop -w e2e

      - name: Desktop shell smoke negative control (broken logout must be detected)
        run: |
          if npm run test:desktop:negative -w e2e > "$RUNNER_TEMP/desktop-negative.log" 2>&1; then
            echo "::error::desktop negative control passed although logout was broken"
            exit 1
          fi
          grep -q "session must be rejected after logout" "$RUNNER_TEMP/desktop-negative.log"
          echo "desktop negative control failed for the intended reason"

      - name: Desktop shell smoke against the PACKAGED app (fuses applied)
        run: npm run test:desktop:packaged -w e2e

      - name: Build the Linux artifacts (AppImage + tar.gz, generic build, placeholder API origin)
        run: SHIKKHAOS_RELEASE=1 npm run package:linux -w desktop -- --api https://api.example.test

      - name: Checksums
        run: cd desktop/release && sha256sum *.AppImage *.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shikkhaos-desktop-linux-generic
          path: |
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
            desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Stop the test database
        if: always()
        run: docker rm -f petra-ci-pg || true
